<!--# FONTES — Inter (texto), Manrope (títulos), IBM Plex Mono (código).
     Os nomes das famílias estão em css/01-tokens-e-base.css, nas variáveis
     --font-sans, --font-display e --font-mono. Trocar a fonte é mexer nos DOIS
     lugares: o link daqui baixa, a variável de lá aplica.

     Os dois preconnect não são enfeite: o CSS do Google Fonts vem de um
     domínio e os arquivos .woff2 de outro. Sem eles, o navegador só descobre o
     segundo domínio depois de baixar o primeiro, e a fonte chega tarde. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
