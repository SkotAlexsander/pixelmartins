<!--# FONTES — três famílias, três papéis, e nenhuma a mais.

     Archivo   display. Cara de sinalização e de cartela de vídeo. É ela que
               dá o peso das chamadas em caixa alta.
     Inter     corpo. Neutra, para o texto sair da frente e deixar ler.
     Plex Mono dados. Timecode, rótulo de faixa, ficha técnica. É o mono que
               faz a página parecer um instrumento e não um site de agência —
               por isso ele tem mais espaço aqui do que é costume.

     Só os pesos usados. Cada peso a mais é um arquivo a mais para o visitante
     baixar antes de o texto aparecer. -->
