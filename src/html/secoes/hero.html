<!--# HERO — a primeira tela.
     Estilo: css/30-hero.css  ·  Efeito: js/40-typewriter.js

     O .hero-dark-bg é um fundo PRÓPRIO, por cima do fundo global. Ele é o véu
     que segura o retrato (--hero-veil, em css/10-fundo.css) — por isso ali o
     retrato pode aparecer mais forte que no resto da página.

     Ao acabar de digitar, o typewriter solta três coisas de uma vez: o cursor
     para de piscar, o indicador de scroll entra e A NAVBAR APARECE. Ela não
     está lá desde o começo — a primeira tela é só a frase.

     A frase existe DUAS vezes: no .sr-only (para leitor de tela) e no
     #typewriter-text (animada, aria-hidden). Trocar uma sem a outra faz o site
     dizer uma coisa e o leitor de tela dizer outra. O texto animado mora em
     js/40-typewriter.js, na constante HERO_TEXT. -->
<!-- ===================== Hero ===================== -->
<section id="top">
  <!-- Fundo "elegant dark pattern" (convertido do componente React DarkGradientBg) -->
  <div class="hero-dark-bg" aria-hidden="true">
    <div class="hdb-gradient">
      <div class="hdb-streak"></div>
      <div class="hdb-streak"></div>
      <div class="hdb-streak"></div>
      <div class="hdb-streak"></div>
      <div class="hdb-streak"></div>
    </div>
    <div class="hdb-texture"></div>
    <div class="hdb-dots"></div>
    <div class="hdb-highlight"></div>
  </div>

  <p class="hero-eyebrow">Alex Martins · sites e vídeo</p>

  <h1 id="hero-heading">
    <span class="sr-only">Seu site e seu vídeo, feitos pela mesma pessoa.</span>
    <span id="typewriter-text" aria-hidden="true"></span><span class="caret caret-blink" id="caret"></span>
  </h1>

  <p class="hero-sub">Você contrata uma pessoa em vez de duas — e a conta de compatibilizar
  o site com o vídeo deixa de ser sua.</p>

  <div id="scroll-indicator">
    <span>scroll</span>
    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </div>
</section>
