     silêncio, cai em spam e some sem rastro. Um mailto: abre o cliente de
     e-mail da pessoa e a mensagem fica na caixa de saída dela — ela sabe que

     transferência (o Discord não tem URL de perfil pública). Por ser botão,
     funciona no teclado com Enter e Espaço sem gambiarra. -->
